<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>三冠冕展台</title>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <script src="libs/three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16213e);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(4, 3, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(3, 6, 4);
  scene.add(dir);
  const stage = new THREE.Mesh(
    new THREE.CylinderGeometry(2.2, 2.4, 0.3, 48),
    new THREE.MeshStandardMaterial({ color: 0x37474f })
  );
  stage.position.y = -0.15;
  scene.add(stage);

  const gold = new THREE.MeshStandardMaterial({
    color: 0xffd34d, metalness: 0.4, roughness: 0.35,
    emissive: 0x7a5200, emissiveIntensity: 0.4
  });
  const makeCrown = (kind, shieldColor) => {
    const crown = new THREE.Group();
    const shield = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 0.08, 32),
      new THREE.MeshStandardMaterial({ color: shieldColor })
    );
    shield.rotation.x = Math.PI / 2;
    crown.add(shield);
    const makeTool = (isPan) => {
      const t = new THREE.Group();
      if (isPan) {
        const head = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.04, 20), gold);
        head.rotation.x = Math.PI / 2;
        head.position.y = 0.14;
        t.add(head);
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.02), gold);
        grip.position.y = -0.1;
        t.add(grip);
      } else {
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.22, 0.03), gold);
        head.position.y = 0.12;
        t.add(head);
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.02), gold);
        grip.position.y = -0.14;
        t.add(grip);
      }
      return t;
    };
    const left = makeTool(kind !== 2);
    left.rotation.z = 0.6;
    left.position.z = 0.06;
    crown.add(left);
    const right = makeTool(kind === 1); // 只有双锅冠的右侧是锅
    right.rotation.z = -0.6;
    right.position.z = 0.07;
    crown.add(right);

    return crown;
  };
  const items = new THREE.Group();
  const defs = [
    { kind: 0, color: 0x2fce6e },
    { kind: 1, color: 0xc23fe0 },
    { kind: 2, color: 0x2f8ff0 }
  ];
  defs.forEach((d, i) => {
    const a = (i / defs.length) * Math.PI * 2;
    const c = makeCrown(d.kind, d.color);
    c.position.set(Math.cos(a) * 1.4, 0.55, Math.sin(a) * 1.4);
    items.add(c);
  });
  scene.add(items);
  const animate = () => {
    requestAnimationFrame(animate);
    items.rotation.y += 0.005;
    renderer.render(scene, camera);
  };
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
